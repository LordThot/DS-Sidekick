name: Import DS Sidekick package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download ZIP
        run: |
          curl -fL "https://raw.githubusercontent.com/LordThot/Info/main/ds_sidekick-1.1.1.zip" -o /tmp/ds.zip

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/ds
          unzip -oq /tmp/ds.zip -d /tmp/ds
          test -n "$(find /tmp/ds -type f -print -quit)"

      - name: Create repository files
        run: |
          python3 - <<'PY'
          import os
          import shutil

          source = "/tmp/ds"
          destination = os.getcwd()
          count = 0

          for root, dirs, files in os.walk(source):
              dirs[:] = [d for d in dirs if d != ".git"]

              for filename in files:
                  src = os.path.join(root, filename)
                  relative = os.path.relpath(src, source)
                  dst = os.path.join(destination, relative)

                  if os.path.commonpath([destination, dst]) != destination:
                      raise RuntimeError("Unsafe path: " + relative)

                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  shutil.copy2(src, dst)
                  count += 1
                  print("Copied:", relative)

          print("Total files copied:", count)

          if count == 0:
              raise RuntimeError("No files were copied")
          PY

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage imported files
        run: |
          git add -A
          git status --short

      - name: Synchronise with GitHub
        run: |
          git fetch origin
          git rebase "origin/${GITHUB_REF_NAME}"

      - name: Commit imported files
        run: |
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
          else
            git commit -m "Import DS Sidekick package"
          fi

      - name: Push commit
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"