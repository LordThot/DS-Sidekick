
name: Import DS Sidekick package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package
        run: |
          curl -fL "https://raw.githubusercontent.com/LordThot/Info/main/ds_sidekick-1.1.1.zip" -o /tmp/ds.zip

      - name: Extract package
        run: |
          mkdir -p /tmp/ds
          unzip -oq /tmp/ds.zip -d /tmp/ds
          echo "Files extracted:"
          find /tmp/ds -type f | head -100
          if ! find /tmp/ds -type f | grep -q .; then
            echo "ERROR: ZIP contains no extracted files."
            exit 1
          fi

      - name: Copy files into repository
        run: |
          rsync -av /tmp/ds/ ./ --exclude='.git'
          echo "Repository files:"
          git status --short

      - name: Commit and push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .
          git status --short
          git commit --allow-empty -m "Import DS Sidekick package"
          git push
