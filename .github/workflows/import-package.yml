
name: Import DS Sidekick package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ZIP
        run: curl -fL "https://raw.githubusercontent.com/LordThot/Info/main/ds_sidekick-1.1.1.zip" -o /tmp/ds.zip

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/ds
          unzip -oq /tmp/ds.zip -d /tmp/ds
          rsync -a --exclude='.git/' --exclude='.github/workflows/import-package.yml' /tmp/ds/ ./

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import DS Sidekick package"
          git push
