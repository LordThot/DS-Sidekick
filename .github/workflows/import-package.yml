name: Import DS Sidekick package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository and its full history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Synchronise BEFORE creating or staging imported files
      - name: Synchronise with GitHub
        run: |
          git fetch origin
          git rebase "origin/${GITHUB_REF_NAME}"

      # 3. Download the original ZIP
      - name: Download ZIP
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/LordThot/Info/main/ds_sidekick-1.1.1.zip" \
            -o /tmp/ds.zip

      # 4. Extract all nested folders and files
      - name: Extract ZIP
        run: |
          mkdir -p /tmp/ds
          unzip -oq /tmp/ds.zip -d /tmp/ds

          if ! find /tmp/ds -type f -print -quit | grep -q .; then
            echo "ERROR: ZIP contains no files."
            exit 1
          fi

      # 5. Copy extracted files into the repository
      - name: Create repository files
        run: |
          python3 - <<'PY'
          import os
          import shutil

          source = "/tmp/ds"
          destination = os.getcwd()
          count = 0

          for root, dirs, files in os.walk(source):
              dirs[:] = [
                  d for d in dirs
                  if d != ".git"
              ]

              for filename in files:
                  src = os.path.join(root, filename)
                  relative = os.path.relpath(src, source)
                  dst = os.path.join(destination, relative)

                  if os.path.commonpath(
                      [destination, os.path.abspath(dst)]
                  ) != destination:
                      raise RuntimeError(
                          "Unsafe file path: " + relative
                      )

                  os.makedirs(
                      os.path.dirname(dst),
                      exist_ok=True
                  )
                  shutil.copy2(src, dst)
                  count += 1
                  print("Copied:", relative)

          print("Total files copied:", count)

          if count == 0:
              raise RuntimeError("No files were copied.")
          PY

      # 6. Configure the automated Git identity
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      # 7. Stage the imported files and show what will be committed
      - name: Stage imported files
        run: |
          git add -A
          git status --short
          git diff --cached --stat

      # 8. Commit only when changes exist
      - name: Commit imported files
        run: |
          if git diff --cached --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Import DS Sidekick package"
          fi

      # 9. Push the commit to the workflow's branch
      - name: Push commit
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"